<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" width="320" height="80">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600&amp;family=DM+Mono:wght@500&amp;display=swap');
    </style>
  </defs>
  <!-- Cube icon -->
  <polygon points="40,8 68,24 40,40 12,24" fill="#FF6B1A"/>
  <polygon points="12,24 40,40 40,64 12,48" fill="#1A1A1A"/>
  <polygon points="68,24 40,40 40,64 68,48" fill="#CC4A00"/>
  <line x1="40" y1="8" x2="40" y2="64" stroke="#FFFFFF" stroke-width="1.5" stroke-dasharray="4 3" opacity="0.5"/>

  <!-- IDR monogram -->
  <text x="84" y="34" font-family="'DM Mono', monospace" font-weight="500" font-size="22" fill="#1A1A1A" letter-spacing="3">IDR</text>
  <!-- Full name -->
  <text x="85" y="54" font-family="'DM Sans', sans-serif" font-weight="400" font-size="11" fill="#555555" letter-spacing="1.5">INSTITUTE OF DIGITAL RISK</text>
